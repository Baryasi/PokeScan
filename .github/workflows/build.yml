name: Build PokeScan.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name PokeScan
          --add-data "pokedex.json;."
          --collect-all rapidocr_onnxruntime
          --collect-submodules pynput pokescan.py

      - uses: actions/upload-artifact@v4
        with:
          name: PokeScan
          path: dist/PokeScan.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PokeScan.exe
