name: Build PokeScan.exe

on:
  push:
    branches: [main]
    paths-ignore: ["dist/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name PokeScan
          --add-data "pokedex.json;."
          --collect-all rapidocr_onnxruntime
          --collect-submodules pynput pokescan.py

      - uses: actions/upload-artifact@v4
        with:
          name: PokeScan
          path: dist/PokeScan.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PokeScan 1.0.${{ github.run_number }}
          body: Download **PokeScan.exe** below and double-click it. Nothing to install.
          make_latest: true
          files: dist/PokeScan.exe
